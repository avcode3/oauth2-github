[project]
name = "oauth2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adithya Vinayak", email = "adithya_development@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.8.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
oauth2 = "oauth2:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
